<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Stranger Text Chat</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f0f2f5; }
        body { display: flex; flex-direction: column; }
        #header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }
        .message { padding: 10px; border-radius: 8px; max-width: 70%; font-size: 16px; }
        .system { background: #e2e3e5; align-self: center; font-size: 14px; }
        .stranger { background: #f1f0f0; align-self: flex-start; color: #333; }
        .you { background: #007bff; color: white; align-self: flex-end; }
        #controls { padding: 15px; background: #eee; display: flex; gap: 10px; box-sizing: border-box; }
        #input-msg { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; min-width: 0; }
        button { padding: 10px 15px; border: none; background: #007bff; color: white; border-radius: 4px; cursor: pointer; font-size: 16px; white-space: nowrap; }
        button#next-btn { background: #dc3545; }
    </style>
    <!-- Include Firebase Database Web Scripts -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <div id="header">Talk to Strangers (US/UK)</div>
    
    <div id="chat-box">
        <div class="message system">Click "Next Chat" to find a stranger...</div>
    </div>

    <div id="controls">
        <button id="next-btn" onclick="triggerAdAndNext()">Next Chat</button>
        <input type="text" id="input-msg" placeholder="Type a message..." disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <script>
        // YOUR EXACT CONFIGURATION KEYS EXTRACTED FROM YOUR SCREENSHOT
        const firebaseConfig = {
            apiKey: "AIzaSyB_2g2vddVsJq7kHF1nPzn2wtz3GDbASSI",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "omegle-alt-chat-bd701",
            storageBucket: "omegle-alt-chat-bd701.firebasestorage.app",
            messagingSenderId: "642927023180",
            appId: "1:642927023180:web:d85711b609992db73c50e9"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let myId = Math.random().toString(36).substring(2, 9);
        let currentRoomId = null;
        let roomRef = null;

        function triggerAdAndNext() {
            // FIRES YOUR MONETAG DIRECT LINK AD IN A NEW BACKGROUND TAB TO TRACK REVENUE
            window.open("https://omg10.com", "_blank");
            
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '<div class="message system">Looking for an online stranger...</div>';
            
            document.getElementById('input-msg').disabled = true;
            document.getElementById('send-btn').disabled = true;

            if(roomRef) roomRef.off();

            const queueRef = db.ref('queue');
            queueRef.once('value', (snapshot) => {
                let queue = snapshot.val();
                if (queue) {
                    let strangerId = Object.keys(queue)[0];
                    currentRoomId = queue[strangerId].roomId;
                    queueRef.child(strangerId).remove();
                    startChat();
                } else {
                    currentRoomId = Math.random().toString(36).substring(2, 9);
                    queueRef.child(myId).set({ roomId: currentRoomId });
                    
                    roomRef = db.ref('rooms/' + currentRoomId);
                    roomRef.on('value', (snap) => {
                        let data = snap.val();
                        if (data && Object.keys(data.users || {}).length > 1) {
                            startChat();
                        }
                    });
                }
                db.ref('rooms/' + currentRoomId + '/users/' + myId).set(true);
            });
        }

        function startChat() {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '<div class="message system">Connected! Say Hello.</div>';
            document.getElementById('input-msg').disabled = false;
            document.getElementById('send-btn').disabled = false;

            roomRef = db.ref('rooms/' + currentRoomId + '/messages');
            roomRef.off(); 
            roomRef.on('child_added', (snapshot) => {
                let msg = snapshot.val();
                if(msg.sender !== myId) {
                    chatBox.innerHTML += '<div class="message stranger">' + msg.text + '</div>';
                } else {
                    chatBox.innerHTML += '<div class="message you">' + msg.text + '</div>';
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function sendMessage() {
            const inputField = document.getElementById('input-msg');
            let txt = inputField.value.trim();
            if(txt === "" || !currentRoomId) return;
            
            db.ref('rooms/' + currentRoomId + '/messages').push({
                sender: myId,
                text: txt
            });
            inputField.value = "";
        }

        // Allow sending message by hitting "Enter" key on keyboard
        document.getElementById('input-msg').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
