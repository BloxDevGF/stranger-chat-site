<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Stranger Text Chat</title>
        <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f0f2f5; }
        body { display: flex; flex-direction: column; }
        #header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }
        .message { padding: 10px; border-radius: 8px; max-width: 70%; }
        .system { background: #e2e3e5; align-self: center; font-size: 14px; }
        .stranger { background: #f1f0f0; align-self: flex-start; }
        .you { background: #007bff; color: white; align-self: flex-end; }
        #controls { padding: 15px; background: #eee; display: flex; gap: 10px; box-sizing: border-box; }
        #input-msg { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; min-width: 0; }
        button { padding: 10px 15px; border: none; background: #007bff; color: white; border-radius: 4px; cursor: pointer; font-size: 16px; white-space: nowrap; }
        button#next-btn { background: #dc3545; }
    </style>

</head>
<body>

    <div id="header">Talk to Strangers (US/UK)</div>
    
    <div id="chat-box">
        <div class="message system">Click "Find Stranger" to start talking...</div>
    </div>

    <div id="controls">
        <button id="next-btn" onclick="triggerAdAndNext()">Next Chat</button>
        <input type="text" id="input-msg" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <script>
        function triggerAdAndNext() {
            // OPENS YOUR LIVE MONETAG DIRECT LINK IN A NEW TAB TO GET AD REVENUE
            window.open("https://omg10.com/4/11070529", "_blank");
            
            // Temporary matching simulation logic
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += '<div class="message system">Looking for a stranger...</div>';
        }
    </script>
</body>
</html>
